[project]
name = "family-vpn-panel"
version = "1.0.0"
description = "Self-hosted OpenVPN management panel for families: per-device certificates, DNS filtering, policies, schedules, monitoring."
license = "Apache-2.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 150
target-version = "py312"
extend-exclude = [".venv", ".devdata"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = [
  "S101",   # assert in tests
  "S603", "S607",  # subprocess with fixed argv lists (root helper / sudo wrapper)
  "S108",   # /tmp paths in tests
  "B008",   # FastAPI Depends() defaults
  "UP017",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
# Root-only harness that drives shell tools on the VPN server; "0.0.0.0" is an expected DNS answer.
"tests/integration/*" = ["S104", "S310", "S602", "S608", "E501"]
"app/adguard.py" = ["S311", "S310"]
"tools/*" = ["S311"]
"app/engine.py" = ["S310"]
